name: Recovery Build (Legacy)
on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_URL'
        required: true
        default: 'https://github.com'
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-9.0'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          
          # Dependencias nativas verificadas para Ubuntu 24.04 LTS
          sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl2-dev libwxgtk3.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 cpio wget build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev llvm libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev repo
          
          # Clang Host Legacy Fix
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5
          sudo ln -sf /usr/lib/i386-linux-gnu/libtinfo.so.6 /usr/lib/i386-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /usr/lib/i386-linux-gnu/libncurses.so.6 /usr/lib/i386-linux-gnu/libncurses.so.5 || true

          # Instalación limpia de Python 2.7 a través de Pyenv
          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global 2.7.18
          sudo ln -sf $HOME/.pyenv/versions/2.7.18/bin/python /usr/bin/python
          sudo ln -sf $HOME/.pyenv/versions/2.7.18/bin/python /usr/bin/python2
          
          # Instalación de twrpdtgen bajo Python 3 nativo
          pip3 install twrpdtgen --break-system-packages

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup SSH Keys
        if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          /usr/bin/repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Check Build Tree
        uses: haya14busa/action-cond@v1
        id: buildtree
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: twrp
          if_false: omni

      - name: Repo Sync
        run: |
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          /usr/bin/repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: Generate Device Tree
        id: gdt
        run: |
          wget ${{ github.event.inputs.IMG_URL }} -O stock_recovery.img
          python3 ${GITHUB_WORKSPACE}/scripts/build.py -i stock_recovery.img -o device
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Sync Device Dependencies
        run: |
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ steps.gdt.outputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          /usr/bin/repo sync -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        continue-on-error: true

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery
        run: |
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ steps.gdt.outputs.MAKEFILE_NAME }}-eng
          make clean
          
          # FORZADO AGRESIVO EN ARCHIVOS BOARDCONFIG.MK
          BOARD_CONFIG_FILE=$(find device/ -name "BoardConfig.mk" | head -n 1)
          if [ -f "$BOARD_CONFIG_FILE" ]; then
            echo "::group::Modificando BoardConfig.mk de forma agresiva"
            sed -i 's/BOARD_RECOVERYIMAGE_PARTITION_SIZE :=.*/BOARD_RECOVERYIMAGE_PARTITION_SIZE := 67108864/g' "$BOARD_CONFIG_FILE"
            echo "LZMA_RAMDISK := true" >> "$BOARD_CONFIG_FILE"
            echo "TW_INCLUDE_CRYPTO := false" >> "$BOARD_CONFIG_FILE"
            echo "TW_EXCLUDE_SUPERSU := true" >> "$BOARD_CONFIG_FILE"
            echo "TW_EXCLUDE_MTP := true" >> "$BOARD_CONFIG_FILE"
            echo "::endgroup::"
          fi
          
          # Compilación inicial del binario crudo
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
          
          # FUNCIÓN DE REPLICA DE HEADER Y FOOTER (PARCHEO MTK)
          OUTPUT_DIR="out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}"
          NEW_IMG="$OUTPUT_DIR/recovery.img"
          STOCK_IMG="stock_recovery.img"
          FINAL_IMG="$OUTPUT_DIR/recovery_signed.img"
          
          if [ -f "$NEW_IMG" ] && [ -f "$STOCK_IMG" ]; then
            echo "::group::Inyectando Firmas y Encabezados MediaTek Stock"
            # 1. Copiamos el encabezado MTK de 512 bytes del recovery stock al nuevo archivo
            dd if="$STOCK_IMG" of="$FINAL_IMG" bs=512 count=1
            # 2. Añadimos el contenido completo del nuevo TWRP compilado
            dd if="$NEW_IMG" of="$FINAL_IMG" bs=512 seek=1
            # 3. Extraemos e inyectamos la firma final (últimos 1024 bytes del stock por seguridad)
            STOCK_SIZE=$(stat -c%s "$STOCK_IMG")
            dd if="$STOCK_IMG" of="$FINAL_IMG" bs=1 skip=$((STOCK_SIZE - 1024)) seek=$(stat -c%s "$FINAL_IMG") count=1024
            
            # Reemplazamos el archivo para que la acción de Release suba la versión firmada de forma transparente
            cp "$FINAL_IMG" "$NEW_IMG"
            echo "::endgroup::"
            
            # SISTEMA DE ALERTAS DE TAMAÑO FÍSICO CONTRA BRICKS
            FINAL_SIZE=$(stat -c%s "$NEW_IMG")
            echo "=========================================================="
            echo "¡COMPILACIÓN COMPLETADA CON ÉXITO!"
            echo "Tamaño de tu partición física límite: 12,657,568 bytes"
            echo "Tamaño del nuevo archivo firmado: $FINAL_SIZE bytes"
            if [ "$FINAL_SIZE" -gt 12657568 ]; then
              echo "⚠️ ADVERTENCIA CRÍTICA: El archivo supera los 12.6MB."
              echo "❌ NO FLASHEES ESTE ARCHIVO EN LA MEMORIA INTERNA."
              echo "👉 Usa únicamente: 'fastboot boot recovery.img' desde PC."
            else
              echo "✅ SEGURO: El archivo cabe en la partición interna."
              echo "👍 Puedes flashearlo con total tranquilidad."
            fi
            echo "=========================================================="
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ steps.gdt.outputs.DEVICE_NAME }}/*vendor*.img
          name: ${{ steps.gdt.outputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ steps.gdt.outputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}.img
            Parcheo de seguridad MediaTek (Header/Footer): Aplicado automáticamente.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
