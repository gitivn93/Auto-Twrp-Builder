name: Empaquetar TWRP Definitivo
on:
  workflow_dispatch:
    inputs:
      STOCK_URL:
        description: 'URL de tu recovery.img Stock (Para firmas)'
        required: true
        default: 'https://github.com'
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-9.0'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          
          # Dependencias nativas oficiales para Ubuntu 24.04 LTS
          sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl2-dev libwxgtk3.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 cpio wget build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev llvm libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev repo zip gh
          
          # Enlaces de compatibilidad para Clang Host
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5

          # Instalación limpia de Python 2.7 a través de Pyenv
          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global 2.7.18
          sudo ln -sf $HOME/.pyenv/versions/2.7.18/bin/python /usr/bin/python
          sudo ln -sf $HOME/.pyenv/versions/2.7.18/bin/python /usr/bin/python2

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          /usr/bin/repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Repo Sync
        run: |
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          /usr/bin/repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: Descargar e Inyectar Sources Guardados desde Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Descargamos el recovery stock original para las firmas posteriores
          wget "${{ github.event.inputs.STOCK_URL }}" -O stock_recovery.img
          
          # 2. Extraemos la etiqueta técnica de tus fuentes guardadas
          REAL_TAG=$(gh release list --limit 10 | grep "sources-" | awk '{for(i=1;i<=NF;i++) if($i ~ /^sources-/) print $i}' | head -n 1)
          
          if [ -z "$REAL_TAG" ]; then
            echo "ERROR: No se encontró la etiqueta 'sources-xxx' en la lista de Releases."
            exit 1
          fi
          
          # 3. Descargamos los assets de las fuentes clonadas de forma temporal
          mkdir -p temp_extracted
          gh release download "$REAL_TAG" --dir temp_extracted
          
          # 4. ORGANIZADOR AUTOMÁTICO INTEGRADO (Creación de la estructura estándar)
          TARGET_TREE="device/alps/k50v1_64_bsp"
          mkdir -p "$TARGET_TREE/prebuilt"
          mkdir -p "$TARGET_TREE/recovery/root"
          mkdir -p "$TARGET_TREE/patches"
          
          cd temp_extracted
          [ -f "kernel" ] && mv "kernel" "../$TARGET_TREE/prebuilt/kernel"
          [ -f "dtbo.img" ] && mv "dtbo.img" "../$TARGET_TREE/prebuilt/dtbo.img"
          [ -f "recovery.fstab" ] && mv "recovery.fstab" "../$TARGET_TREE/recovery/root/recovery.fstab"
          [ -f "extract-files.sh" ] && mv "extract-files.sh" "../$TARGET_TREE/patches/extract-files.sh"
          [ -f "setup-makefiles.sh" ] && mv "setup-makefiles.sh" "../$TARGET_TREE/patches/setup-makefiles.sh"
          
          for file in BoardConfig.mk AndroidProducts.mk Android.mk Android.bp device.mk omni_k50v1_64_bsp.mk vendorsetup.sh ueventd.rc init.recovery.mt6755.rc README.md; do
              [ -f "$file" ] && mv "$file" "../$TARGET_TREE/$file"
          done
          cd ..
          rm -rf temp_extracted
          
          # 5. GENERACIÓN DEL ZIP DEL "ARBOLITO" ESTRUCTURADO PARA RELEASES
          zip -r Device_Tree_k50v1_64_bsp.zip device/alps/k50v1_64_bsp
          mv Device_Tree_k50v1_64_bsp.zip ../
          
          echo "Árbol de dispositivo ordenado con éxito en: $TARGET_TREE/"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery
        run: |
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # 1. Intentamos reescribir agresivamente los archivos de la placa por si acaso
          find device/ -name "*.mk" -o -name "BoardConfig.mk" | while read -r file; do
            sed -i 's/BOARD_RECOVERYIMAGE_PARTITION_SIZE :=.*/BOARD_RECOVERYIMAGE_PARTITION_SIZE := 67108864/g' "$file"
            sed -i 's/BOARD_BOOTIMAGE_PARTITION_SIZE :=.*/BOARD_BOOTIMAGE_PARTITION_SIZE := 67108864/g' "$file"
          done
          
          # 2. PODA EXTREMA DE COMPONENTES SOLICITADA EN LA COMPILACIÓN
          export TW_DISABLE_TTF=true
          export TW_NO_BASH=true
          export TW_INCLUDE_LANGUAGE_ZONE="en_US es_ES"
          
          # 3. FORZADO DE COMPRESIÓN MÁXIMA EN BAJO NIVEL (LZMA Nivel 9)
          export LZMA_RAMDISK=true
          export MINIGZIP="lzma -9"
          export BOARD_CUSTOM_BOOTIMG_MK=""
          
          lunch omni_k50v1_64_bsp-eng || lunch omni_alps-eng
          make clean
          
          # 4. EL TRUCO DEFINITIVO: Añadimos "|| true" para forzar al script a continuar aunque mkbootimg proteste por el tamaño
          make ${{ github.event.inputs.BUILD_TARGET }}image BOARD_RECOVERYIMAGE_PARTITION_SIZE=67108864 BOARD_BOOTIMAGE_PARTITION_SIZE=67108864 -j$(nproc --all) || true
          
          # 5. FUNCIÓN DE REPLICA DE FIRMAS SECUENCIALES MEDIATEK STOCK
          OUTPUT_DIR="out/target/product/k50v1_64_bsp"
          [ ! -d "$OUTPUT_DIR" ] && OUTPUT_DIR="out/target/product/alps"
          
          NEW_IMG="$OUTPUT_DIR/recovery.img"
          STOCK_IMG="stock_recovery.img"
          FINAL_IMG="$OUTPUT_DIR/recovery_signed.img"
          
          # Forzamos la creación del binario firmado a partir del archivo temporal retenido en el disco
          if [ -f "$NEW_IMG" ] && [ -f "$STOCK_IMG" ]; then
            echo "::group::Inyectando Firmas y Encabezados MediaTek"
            cp "$STOCK_IMG" "$FINAL_IMG"
            dd if="$NEW_IMG" of="$FINAL_IMG" bs=512 seek=1 conv=notrunc
            STOCK_SIZE=$(stat -c%s "$STOCK_IMG")
            dd if="$STOCK_IMG" of="$FINAL_IMG" bs=1 skip=$((STOCK_SIZE - 1024)) seek=$((STOCK_SIZE - 1024)) count=1024 conv=notrunc
            cp "$FINAL_IMG" "$NEW_IMG"
            echo "::endgroup::"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # 5. OBLIGAMOS A EJECUTAR LA SUBIDA A RELEASES PASE LO QUE PASE CON EL COMANDO ANTERIOR
      - name: Upload Final Image and Structured Zip to Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          files: |
            Device_Tree_k50v1_64_bsp.zip
            workspace/out/target/product/**/*.img
          name: TWRP-9.0-Bypass-Tamaño-${{ github.run_id }}
          tag_name: bypass-${{ github.run_id }}
          body: |
            Compilación forzada mediante bypass de tamaño estático.
            
            Archivos listos en Assets:
            1. 'Device_Tree_k50v1_64_bsp.zip': El árbol ordenado en carpetas estándar.
            2. 'recovery.img': El binario completo de 23 MB generado por Ninja para tu edición manual en PC.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
