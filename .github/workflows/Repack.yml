name: Fast Recovery Repack & Sign
on:
  workflow_dispatch:
    inputs:
      STOCK_URL:
        description: 'URL de tu recovery.img Stock (Para firmas)'
        required: true
        default: 'https://github.com'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  repack:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check Out Repositorio
        uses: actions/checkout@v4

      - name: Descargar Imagen Stock y Herramientas
        run: |
          sudo apt update
          sudo apt install -y cpio wget gh
          
          # 1. Descargamos el recovery original desde la URL con un nombre fijo
          wget "${{ github.event.inputs.STOCK_URL }}" -O stock_recovery.img

      - name: Descargar y Extraer el TWRP desde Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2. Localizamos el último lanzamiento en Releases de tu repositorio
          echo "Buscando el último lanzamiento en Releases..."
          LATEST_TAG=$(gh release list --limit 1 | awk '{print $1}')
          
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No se encontró ningún lanzamiento en la sección Releases de tu repositorio."
            exit 1
          fi
          echo "Último lanzamiento detectado con el tag: $LATEST_TAG"
          
          # 3. Descargamos el archivo comprimido del Source Code generado por la compilación anterior
          mkdir -p twrp_sources
          gh release download "$LATEST_TAG" --archive=zip --dest twrp_sources
          
          # 4. Descomprimimos las fuentes dentro de la máquina virtual
          cd twrp_sources
          unzip -q *.zip
          
          # 5. Buscamos el binario real de TWRP generado en la fase OUT de los fuentes extraídos
          TWRP_BIN=$(find . -name "recovery.img" | head -n 1)
          if [ -z "$TWRP_BIN" ]; then
            echo "ERROR: No se encontró el binario recovery.img compilado dentro de tus fuentes de Release."
            exit 1
          fi
          
          # Lo movemos a la raíz principal de trabajo externa
          cp "$TWRP_BIN" ../compiled_twrp.img
          cd ..
          echo "¡Binario real de TWRP rescatado con éxito!"

      - name: Reempaquetar y Firmar Binario MTK Real
        run: |
          # 6. PROCESO DE FIRMA BINARIA MTK CLONANDO EL MOLDE STOCK
          # Conservamos el bloque de arranque inicial de 512 bytes del procesador MediaTek
          dd if=stock_recovery.img of=recovery_final.img bs=512 count=1 conv=notrunc
          
          # Inyectamos el binario real de TWRP que acabamos de rescatar del ZIP
          dd if=compiled_twrp.img of=recovery_final.img bs=512 seek=1 conv=notrunc
          
          # Extraemos y pegamos el footer (Firma de seguridad de los últimos 1024 bytes del stock)
          STOCK_SIZE=$(stat -c%s stock_recovery.img)
          dd if=stock_recovery.img of=recovery_final.img bs=1 skip=$((STOCK_SIZE - 1024)) seek=$((STOCK_SIZE - 1024)) count=1024 conv=notrunc

      - name: Verificación Física de Seguridad contra Bricks
        run: |
          # Validamos el peso real frente al límite del hardware de tu dispositivo (12.6 MB)
          FINAL_SIZE=$(stat -c%s recovery_final.img)
          echo "=========================================================="
          echo "¡PROCESO COMPLETADO EN SEGUNDOS!"
          echo "Límite físico de tu partición interna: 12,657,568 bytes"
          echo "Tamaño del nuevo TWRP Firmado generado: $FINAL_SIZE bytes"
          
          if [ $FINAL_SIZE -gt 12657568 ]; then
            echo "ALERTA CRÍTICA: El archivo sigue siendo demasiado grande."
            echo "No lo flashees para evitar un bootloop."
          else
            echo "¡ESTADO SEGURO! El archivo coincide exactamente con la geometría de tu LK."
          fi
          echo "=========================================================="

      - name: Publicar Archivo Final de Inmediato
        uses: softprops/action-gh-release@v2
        with:
          files: |
            recovery_final.img
          name: TWRP-Firmado-Final-${{ github.run_id }}
          tag_name: final-${{ github.run_id }}
          body: |
            ¡Recovery final listo para flashear!
            Binario extraído de forma segura de los fuentes del Release anterior.
            Encabezados, geometrías y firmas clonados del molde original de MediaTek.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
