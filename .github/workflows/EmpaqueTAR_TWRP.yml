name: EmpaqueTAR TWRP V1.0

on:
  workflow_dispatch:
    inputs:
      STOCK_URL:
        description: 'URL directa del recovery.img stock usado para preservar header/footer MediaTek'
        required: true
        type: string
      MANIFEST_URL:
        description: 'URL del manifest TWRP'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
        type: string
      MANIFEST_BRANCH:
        description: 'Rama del manifest TWRP'
        required: false
        default: 'twrp-9.0'
        type: string
      BUILD_TARGET:
        description: 'Target de recovery'
        required: false
        default: 'recovery'
        type: string

env:
  DEVICE_TREE_RELEASE_TAG: lab-build-30973601644
  DEVICE_TREE_ASSET: Alps_device_tree_complete.tar.gz

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Prepare the environment
        run: |
          set -e
          sudo apt update
          sudo apt -y upgrade

          sudo apt -y install \
            gperf gcc-multilib g++-multilib libc6-dev x11proto-dev libx11-dev tree \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl2-dev \
            libwxgtk3.2-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static python3 cpio wget \
            build-essential libssl-dev zlib1g-dev libreadline-dev libsqlite3-dev \
            llvm libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev repo zip gh

          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5

          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global 2.7.18
          sudo ln -sf "$HOME/.pyenv/versions/2.7.18/bin/python" /usr/bin/python
          sudo ln -sf "$HOME/.pyenv/versions/2.7.18/bin/python2" /usr/bin/python2

      - name: Install OpenJDK (JAVA JAVITAAAAAA)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Initialize repo
        id: pwd
        run: |
          set -e
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          /usr/bin/repo init --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: Repo Sync
        working-directory: workspace
        run: |
          set -e
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"
          /usr/bin/repo sync -j$(nproc --all) --force-sync

      - name: Descargamos el Device Tree modificado desde Releases
        working-directory: workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          rm -rf temp_tree
          mkdir -p temp_tree

          gh release download "${{ env.DEVICE_TREE_RELEASE_TAG }}" \
          --repo gitivn93/Auto-Twrp-Builder \
          --pattern "${{ env.DEVICE_TREE_ASSET }}" \
          --dir temp_tree

          test -f "temp_tree/${{ github.event.inputs.DEVICE_TREE_ASSET }}"
          tar -xzf "temp_tree/${{ github.event.inputs.DEVICE_TREE_ASSET }}"
          rm -rf temp_tree

          test -f device/alps/k50v1_64_bsp/BoardConfig.mk
          test -f device/alps/k50v1_64_bsp/AndroidProducts.mk
          test -f device/alps/k50v1_64_bsp/device.mk

          echo "===== DEVICE TREE ====="
          find device/alps/k50v1_64_bsp -maxdepth 2 | sort

          echo "===== RECOVERY PARTITION ====="
          grep -n "BOARD_RECOVERYIMAGE_PARTITION_SIZE" \
            device/alps/k50v1_64_bsp/BoardConfig.mk

      - name: Descargar recovery stock para conservar firmas MediaTek
        working-directory: workspace
        run: |
          set -e
          wget -O stock_recovery.img "${{ github.event.inputs.STOCK_URL }}"
          test -s stock_recovery.img
          echo "Stock recovery: $(stat -c%s stock_recovery.img) bytes"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Validate Device Tree and Build recovery
        working-directory: workspace
        run: |
          set -e
          export PATH="$HOME/.pyenv/versions/2.7.18/bin:$PATH"

          RECOVERY_LIMIT=$(awk -F':=' '/^[[:space:]]*BOARD_RECOVERYIMAGE_PARTITION_SIZE[[:space:]]*:=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' \
            device/alps/k50v1_64_bsp/BoardConfig.mk)

          test -n "$RECOVERY_LIMIT"
          echo "BOARD_RECOVERYIMAGE_PARTITION_SIZE=$RECOVERY_LIMIT"

          grep -Eq "^[[:space:]]*TW_EXTRA_LANGUAGES[[:space:]]*[:?+]?=[[:space:]]*false[[:space:]]*$" device/alps/k50v1_64_bsp/BoardConfig.mk
          grep -Eq "^[[:space:]]*TW_EXCLUDE_BASH[[:space:]]*[:?+]?=[[:space:]]*true[[:space:]]*$" device/alps/k50v1_64_bsp/BoardConfig.mk
          grep -Eq "^[[:space:]]*TW_EXCLUDE_NANO[[:space:]]*[:?+]?=[[:space:]]*true[[:space:]]*$" device/alps/k50v1_64_bsp/BoardConfig.mk
          grep -Eq "^[[:space:]]*TW_EXCLUDE_PYTHON[[:space:]]*[:?+]?=[[:space:]]*true[[:space:]]*$" device/alps/k50v1_64_bsp/BoardConfig.mk

          echo "===== BUILD FLAGS CONFIRMED ====="
          grep -E "^(TW_EXTRA_LANGUAGES|TW_EXCLUDE_BASH|TW_EXCLUDE_NANO|TW_EXCLUDE_PYTHON)[[:space:]]*[:?+]?=" device/alps/k50v1_64_bsp/BoardConfig.mk

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch omni_k50v1_64_bsp-eng || lunch omni_alps-eng

          make clean
          make "${{ github.event.inputs.BUILD_TARGET }}image" -j$(nproc --all)

          OUTPUT_DIR="out/target/product/k50v1_64_bsp"
          if [ ! -d "$OUTPUT_DIR" ]; then
            OUTPUT_DIR="out/target/product/alps"
          fi

          NEW_IMG="$OUTPUT_DIR/recovery.img"
          test -f "$NEW_IMG"

          NEW_SIZE=$(stat -c%s "$NEW_IMG")
          echo "Recovery generado: $NEW_SIZE bytes"
          echo "Límite declarado: $RECOVERY_LIMIT bytes"

          if [ "$NEW_SIZE" -gt "$RECOVERY_LIMIT" ]; then
            echo "ERROR: recovery.img supera BOARD_RECOVERYIMAGE_PARTITION_SIZE"
            exit 1
          fi

      - name: Firmar recovery con header y footer stock MediaTek
        working-directory: workspace
        run: |
          set -e

          RECOVERY_LIMIT=$(awk -F':=' '/^[[:space:]]*BOARD_RECOVERYIMAGE_PARTITION_SIZE[[:space:]]*:=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' device/alps/k50v1_64_bsp/BoardConfig.mk)
          test -n "$RECOVERY_LIMIT"

          OUTPUT_DIR="out/target/product/k50v1_64_bsp"
          if [ ! -d "$OUTPUT_DIR" ]; then
            OUTPUT_DIR="out/target/product/alps"
          fi

          NEW_IMG="$OUTPUT_DIR/recovery.img"
          STOCK_IMG="stock_recovery.img"
          FINAL_IMG="$OUTPUT_DIR/recovery_signed.img"

          test -f "$NEW_IMG"
          test -f "$STOCK_IMG"

          STOCK_SIZE=$(stat -c%s "$STOCK_IMG")
          NEW_SIZE=$(stat -c%s "$NEW_IMG")

          if [ "$STOCK_SIZE" -gt "$RECOVERY_LIMIT" ]; then
            echo "ERROR: el recovery stock mide $STOCK_SIZE bytes, por encima del límite declarado de $RECOVERY_LIMIT bytes"
            exit 1
          fi

          if [ $((NEW_SIZE + 512)) -gt "$STOCK_SIZE" ]; then
            echo "ERROR: el nuevo recovery no cabe en el contenedor stock manteniendo header de 512 bytes y footer MediaTek"
            echo "Nuevo payload: $NEW_SIZE bytes"
            echo "Stock: $STOCK_SIZE bytes"
            exit 1
          fi

          cp "$NEW_IMG" "$OUTPUT_DIR/recovery_unsigned.img"

          # Conservamos el header de 512 bytes del recovery stock.
          # Insertamos el recovery nuevo desde el segundo sector.
          # Finalmente restauramos los últimos 1024 bytes del stock.
          cp "$STOCK_IMG" "$FINAL_IMG"
          dd if="$NEW_IMG" of="$FINAL_IMG" bs=512 seek=1 conv=notrunc status=none
          dd if="$STOCK_IMG" of="$FINAL_IMG" \
            bs=1 skip=$((STOCK_SIZE - 1024)) seek=$((STOCK_SIZE - 1024)) \
            count=1024 conv=notrunc status=none

          cp "$FINAL_IMG" "$NEW_IMG"

          SIGNED_SIZE=$(stat -c%s "$NEW_IMG")
          echo "Stock: $STOCK_SIZE bytes"
          echo "Nuevo payload: $NEW_SIZE bytes"
          echo "Recovery firmado: $SIGNED_SIZE bytes"

          # Comprobaciones de integridad del header/footer.
          cmp -n 512 "$STOCK_IMG" "$NEW_IMG"
          cmp -s \
            <(dd if="$STOCK_IMG" bs=1 skip=$((STOCK_SIZE - 1024)) count=1024 status=none) \
            <(dd if="$NEW_IMG" bs=1 skip=$((STOCK_SIZE - 1024)) count=1024 status=none)

          echo "===== FIRMA MEDIA TEK ====="
          echo "Header stock: OK"
          echo "Footer stock (1024 bytes): OK"

      - name: Preparar artefactos finales
        working-directory: workspace
        run: |
          set -e

          OUTPUT_DIR="out/target/product/k50v1_64_bsp"
          if [ ! -d "$OUTPUT_DIR" ]; then
            OUTPUT_DIR="out/target/product/alps"
          fi

          test -f "$OUTPUT_DIR/recovery.img"
          test -f "$OUTPUT_DIR/recovery_unsigned.img"

          rm -rf "$GITHUB_WORKSPACE/release_artifacts"
          mkdir -p "$GITHUB_WORKSPACE/release_artifacts"

          cp "$OUTPUT_DIR/recovery.img" "$GITHUB_WORKSPACE/release_artifacts/recovery.img"
          cp "$OUTPUT_DIR/recovery_unsigned.img" "$GITHUB_WORKSPACE/release_artifacts/recovery_unsigned.img"

          echo "===== FINAL ARTIFACTS ====="
          ls -lh "$GITHUB_WORKSPACE/release_artifacts"

      - name: Publicar recovery firmado
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/recovery.img
            release_artifacts/recovery_unsigned.img
          name: TWRP-9.0-Signed-${{ github.run_id }}
          tag_name: twrp-signed-${{ github.run_id }}
          body: |
            Build de TWRP usando exclusivamente el Device Tree modificado descargado desde el Release indicado.

            recovery.img contiene el recovery firmado preservando header y footer MediaTek del stock.
            recovery_unsigned.img conserva el resultado generado por la build antes de la inyección de header/footer.
            La build se valida contra BOARD_RECOVERYIMAGE_PARTITION_SIZE sin ampliar artificialmente el límite.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
